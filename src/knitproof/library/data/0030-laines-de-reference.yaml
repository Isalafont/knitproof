  - id: sandnes-garn-sunday
    brand: Sandnes Garn
    name: Sunday
    composition:
      parts:
        - {fiber: merino, label_term: merinoull, percent: 100}
    superwash: false
    label:
      gauge:
        stitches: "28"
        width: {value: "4", unit: in}
      needles:
        - {system: mm, original: 3 mm}
      length_m: 235
      weight_g: 50
      yarn_weight: Fingering (14 wpi)
      care: "Vasker du i maskin anbefaler vi at alle ullplagg vaskes separat på ullprogram for en mest skånsom behandling. På grunn av merinoullens unike absorberingsevne er det viktig å sentrifugere håndstrikkede plagg godt, før det tørkes flatt, gjerne oppå et håndkle. Bruk aldri vaskepose når du vasker håndstrikkede plagg i ull. Dette skaper friksjon som kan føre til at plagget tover."
    source:
      kind: reference_measurement
      reference: https://www.sandnesgarn.no/sunday
      read_on: 2026-11-12
      location: "« ikke-superwash behandlet » ; Ca. 235 meter pr. 50 gram ; Pinne nr 3 ; échantillon non trouvé sur la page Sandnes Garn ; échantillon : fiche Ravelry https://www.ravelry.com/yarns/library/sandnes-garn-sunday, lue le 12/11/2026 dans le navigateur d’Isabelle, pas par l’API ; grosseur : fiche Ravelry https://www.ravelry.com/yarns/library/sandnes-garn-sunday, lue le 12/11/2026 dans le navigateur d’Isabelle, pas par l’API ; mot de Ravelry, pas du fabricant"
