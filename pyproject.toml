[project]
name = "knitproof"
version = "0.1.0"
description = "Generate, verify and validate knitting patterns with AI: the model proposes, the engine proves."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Isabelle Lafont", email = "isalafont@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
