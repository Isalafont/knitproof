# Bonnet synthétique, écrit pour knitproof : aucun patron réel.
# Taille M : 84 m, côtes 2/2 sur 14 rangs, jersey jusqu’au rang 44.
# Calotte en 7 sections, diminutions par paliers : tous les 4 rangs, puis tous les 2 rangs, puis à chaque rang.
