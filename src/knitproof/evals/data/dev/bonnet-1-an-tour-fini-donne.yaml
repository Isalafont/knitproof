id: bonnet-1-an-tour-fini-donne
input: Bonnet pour mon fils d’un an. Son tour de tête est de 46 cm ; je le veux un peu ajusté pour qu’il
  ne le perde pas, alors je vise un bonnet de 42 cm de tour une fois fini. Mon échantillon, lavé puis
  bloqué, compte 22 mailles pour 10 cm avec des aiguilles de 3,5 mm. Tricot en rond, bord en côtes 2/2.
  Quel nombre de mailles monter ?
request:
  head_circumference:
    value: '46'
    unit: cm
    provenance: measured
  needles:
  - size: 3.5 mm
    kind: double_pointed
  stitch_multiple:
    repeat_multiple: 4
    repeat_offset: 0
    provenance: entered
  ease:
    value: '-4'
    unit: cm
    provenance: entered
  swatch:
    stitch: stockinette
    needle:
      size: 3.5 mm
      kind: straight
    after_blocking:
      stitches: '22'
      width:
        value: '10'
        unit: cm
expected:
  target_circumference_cm: '42'
  cast_on_stitches: 92
